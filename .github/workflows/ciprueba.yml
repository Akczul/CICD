name: CI-verificar-codigo

on:
  push:
    branches: [ rama1 ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mostrar URL esperada
        run: |
          echo "URL esperada: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "::notice title=URL esperada::https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Validar archivos básicos
        run: |
          test -f index.html
          test -d css
          test -f css/styles.css
          echo "Archivos básicos verificados correctamente"

      - name: Validar codigo HTML y CSS
        run: |
          grep -q "<!DOCTYPE html>" index.html
          grep -q "<title>Taller Módulo 1</title>" index.html
          grep -q "<link rel=\"stylesheet\" href=\"css/styles.css\">" index.html
          grep -q ".contenedor" css/styles.css
          grep -q ".boton" css/styles.css
          echo "Codigo HTML y CSS validado de forma basica"

      - name: Simular despliegue
        run: echo "Artefactos listos para el despliegue en el entorno de Staging"

  desplegar:
    runs-on: ubuntu-latest
    needs: verificar
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefactos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar pagina
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mostrar URL de la pagina
        if: always()
        run: |
          if [ -n "${{ steps.deployment.outputs.page_url }}" ]; then
            echo "URL desplegada: ${{ steps.deployment.outputs.page_url }}"
            echo "::notice title=URL desplegada::${{ steps.deployment.outputs.page_url }}"
          else
            echo "URL esperada: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            echo "::notice title=URL esperada::https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi